apply plugin: 'com.android.library'

group = 'expo.modules.f7five0auto'
version = '1.0.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useDefaultAndroidSdkVersions()
useExpoPublishing()

android {
  namespace "expo.modules.f7five0auto"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // MediaBrowserServiceCompat / MediaSessionCompat for the Android Auto browse
  // service. Same artifact react-native-track-player's KotlinAudio uses.
  implementation "androidx.media:media:1.6.0"
}
