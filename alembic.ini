# Alembic config for F7FIVE0.
# Run all alembic commands from the repo root so this file is picked up and
# the `backend/` path is importable.
#
# Usage:
#   cd <repo>
#   .\backend\.venv\Scripts\Activate.ps1
#   $env:PYTHONPATH="$PWD\backend"
#   alembic revision --autogenerate -m "message"
#   alembic upgrade head

[alembic]
script_location = backend/alembic
prepend_sys_path = backend
# URL is read from app.config at runtime. This line is a stub so alembic doesn't complain.
sqlalchemy.url = driver://user:pass@host/dbname

# Render filenames as 0001_description.py
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 60

timezone = UTC

[post_write_hooks]
# Intentionally empty. Formatters run outside Alembic; adding a hook here would
# slow every revision autogen.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
