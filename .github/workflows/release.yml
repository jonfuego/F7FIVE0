name: Release

# Release order (the server and its Android app ship as one version):
#   1. scripts\release-apk.ps1 -Version 1.0.0 (locally). Builds and signs the
#      phone APK and uploads it to a DRAFT release for v1.0.0.
#   2. git push origin v1.0.0. This workflow downloads the APK from the draft,
#      checks its .sha256, bundles it into F7FIVE0-Setup-1.0.0.exe and the
#      zip, attaches those, and publishes the release. No APK = no release.
#
# The Android APK is NOT built or signed here. The Android RELEASE KEY never
# goes to GitHub: do not add the Android signing keystore, its password, or any
# Play/upload key secret to this repo. (This rule is about the Android release
# key only. The Setup.exe Authenticode step below is different: it signs through
# SignPath using a SIGNPATH_API_TOKEN secret, no private key ever lands here,
# and the step no-ops when that secret is absent.)
#
# Manual runs (test builds) take an optional release tag to borrow APKs from;
# without one the build has no Android app.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (no leading v)"
        required: true
        default: "0.0.0-test"
      apk_from:
        description: "Release tag to take the phone APK(s) from (optional)"
        required: false
        default: ""

# Least privilege at the top: read only. The publishing job below elevates
# itself to contents: write because it uploads release assets and flips the
# draft. Test builds (workflow_dispatch) never reach the publish step.
permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    # Only this job touches a GitHub release (the "Attach and publish" step),
    # so write is scoped here rather than at the workflow top level.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "${{ inputs.version }}" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Android APK from the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          APK_FROM: ${{ inputs.apk_from }}
        run: |
          $dir = "installer/apk"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            $v = "${{ steps.v.outputs.version }}"
            gh release download $tag --dir $dir --pattern "F7FIVE0-$v.apk" --pattern "F7FIVE0-$v.apk.sha256" --pattern "F7FIVE0-$v-armv7.apk" --pattern "F7FIVE0-$v-armv7.apk.sha256"
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$dir/F7FIVE0-$v.apk")) {
              Write-Error "No F7FIVE0-$v.apk on release $tag. Run scripts\release-apk.ps1 -Version $v before pushing the tag."
              exit 1
            }
          } elseif ($env:APK_FROM) {
            gh release download $env:APK_FROM --dir $dir --pattern "F7FIVE0-[0-9]*.apk" --pattern "F7FIVE0-[0-9]*.apk.sha256"
            if ($LASTEXITCODE -ne 0) { Write-Error "Could not download APKs from $env:APK_FROM"; exit 1 }
          } else {
            Write-Host "::warning::No apk_from given; this build has no Android app."
          }
          Get-ChildItem $dir | Format-Table Name, Length
      - name: Build dist + Setup.exe
        shell: pwsh
        run: |
          # Tag builds must bundle the matching APK; manual test builds may skip it.
          $isTag = "${{ github.ref_type }}" -eq "tag"
          ./installer/build-dist.ps1 -Version "${{ steps.v.outputs.version }}" -Compile -ApkDir installer/apk -RequireApk:$isTag
      # Authenticode signing for the Setup.exe, done through SignPath Foundation.
      # No private key ever lands in this repo: SignPath holds the certificate and
      # we hand it the artifact over its API. The step is gated on a boolean that
      # the "SignPath available?" step derives from the SIGNPATH_API_TOKEN secret,
      # because an if: cannot read a secret directly. With no secret configured the
      # gate is false and signing is skipped cleanly, so the build still succeeds
      # and ships an unsigned Setup.exe (Jon will enrol with SignPath and add the
      # secret later).
      - name: SignPath available?
        id: signpath
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $available = -not [string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)
          "available=$($available.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $available) {
            Write-Host "::notice::SIGNPATH_API_TOKEN not configured; skipping Authenticode signing of Setup.exe."
          }
      - name: Sign Setup.exe (SignPath)
        if: steps.signpath.outputs.available == 'true'
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $exe = Get-ChildItem installer/Output -Filter "F7FIVE0-Setup-*.exe" -File | Select-Object -First 1
          if (-not $exe) { Write-Error "No Setup.exe found to sign in installer/Output"; exit 1 }
          $org = if ($env:SIGNPATH_ORGANIZATION_ID) { $env:SIGNPATH_ORGANIZATION_ID } else { "f7five0" }
          $project = if ($env:SIGNPATH_PROJECT_SLUG) { $env:SIGNPATH_PROJECT_SLUG } else { "f7five0" }
          $policy = if ($env:SIGNPATH_SIGNING_POLICY_SLUG) { $env:SIGNPATH_SIGNING_POLICY_SLUG } else { "release-signing" }
          $headers = @{ Authorization = "Bearer $env:SIGNPATH_API_TOKEN" }
          $base = "https://app.signpath.io/api/v1/$org"
          Write-Host "Submitting $($exe.Name) to SignPath (project=$project, policy=$policy)"
          $form = @{
            ProjectSlug         = $project
            SigningPolicySlug   = $policy
            Artifact            = $exe
          }
          $submit = Invoke-RestMethod -Method Post -Uri "$base/SigningRequests" -Headers $headers -Form $form
          $id = $submit.signingRequestId
          if (-not $id) { Write-Error "SignPath did not return a signing request id"; exit 1 }
          Write-Host "SignPath signing request $id submitted; waiting for the signed artifact."
          $deadline = (Get-Date).AddMinutes(20)
          do {
            Start-Sleep -Seconds 15
            $status = Invoke-RestMethod -Method Get -Uri "$base/SigningRequests/$id" -Headers $headers
            Write-Host "  status: $($status.status)"
            if ($status.status -eq "Failed" -or $status.status -eq "Denied" -or $status.status -eq "Canceled") {
              Write-Error "SignPath signing request $id ended as $($status.status)"; exit 1
            }
          } while ($status.status -ne "Completed" -and (Get-Date) -lt $deadline)
          if ($status.status -ne "Completed") { Write-Error "SignPath signing request $id timed out"; exit 1 }
          Invoke-RestMethod -Method Get -Uri "$base/SigningRequests/$id/SignedArtifact" -Headers $headers -OutFile $exe.FullName
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Host "Signed $($exe.Name): $($sig.Status) ($($sig.SignerCertificate.Subject))"
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path installer/dist/* -DestinationPath "installer/Output/F7FIVE0-${{ steps.v.outputs.version }}.zip"
      # CycloneDX SBOMs for the three shippable code trees. The tools run through
      # pipx/npx so they are never added to requirements or package.json. The
      # Python SBOM is built from the hash-pinned backend lock; the web and mobile
      # SBOMs from their package-lock.json.
      - name: SBOMs (CycloneDX)
        shell: pwsh
        run: |
          python -m pip install --upgrade pipx
          # cyclonedx-bom installs the "cyclonedx-py" console script, so run it by
          # spec. Build the Python SBOM from the hash-pinned backend lock.
          pipx run --spec cyclonedx-bom cyclonedx-py requirements backend/requirements.lock --output-format JSON --output-file installer/Output/sbom-backend.cdx.json
          # --ignore-npm-errors: cyclonedx-npm runs `npm ls` under the hood, which
          # exits non-zero on this repo's peer-dep warnings (Expo / RN use
          # legacy-peer-deps). The flag lets the SBOM build complete anyway.
          npx --yes @cyclonedx/cyclonedx-npm --ignore-npm-errors --package-lock-only --output-format json --output-file installer/Output/sbom-web.cdx.json frontend/package.json
          npx --yes @cyclonedx/cyclonedx-npm --ignore-npm-errors --package-lock-only --output-format json --output-file installer/Output/sbom-mobile.cdx.json mobile/package.json
          Get-ChildItem installer/Output -Filter "sbom-*.cdx.json" | Format-Table Name, Length
      # SHA256SUMS over the shipped binaries (Setup.exe and the zip), written in
      # the usual "<hash>  <name>" form so `sha256sum -c` and certutil both verify.
      - name: Checksums
        shell: pwsh
        run: |
          $out = "installer/Output"
          $files = Get-ChildItem $out -File | Where-Object { $_.Extension -in ".exe", ".zip" } | Sort-Object Name
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($f.Name)"
          }
          Set-Content -Path (Join-Path $out "SHA256SUMS.txt") -Value $lines -Encoding ascii
          Get-Content (Join-Path $out "SHA256SUMS.txt")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: F7FIVE0-${{ steps.v.outputs.version }}
          path: installer/Output/*
      - name: Attach and publish
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release upload $tag (Get-ChildItem installer/Output -File).FullName --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $generated = gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name=$tag --jq .body
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # A "which file" guide goes above GitHub's change list, so people who
          # land on the release page download Setup.exe, not the zip or the APK.
          $header = @'
          ## Which file do I need?

          | File | What it is |
          |---|---|
          | `F7FIVE0-Setup-X.Y.Z.exe` | **The Windows installer. Most people need only this file.** Run it on the PC that will be your media server. |
          | `F7FIVE0-X.Y.Z.apk` | The Android phone app. It installs on a phone, not on Windows. Easier: once your server is running, sign in from your phone's browser and use **Account > Download for Android**. |
          | `F7FIVE0-X.Y.Z.zip` | The same server files without the wizard, for installing from PowerShell. See "Installing without the wizard" in INSTALL.md. |
          | `SHA256SUMS.txt` | Checksums for the installer and the zip. |
          | `sbom-*.cdx.json` | Software bill of materials. |

          Setup needs a 64-bit Windows 10 (1809 or newer) or Windows 11 PC, an administrator account, and an internet connection. Setup is not code-signed yet, so Windows may show "Windows protected your PC": choose **More info**, then **Run anyway**. Full guide: [INSTALL.md](https://github.com/{REPO}/blob/vX.Y.Z/INSTALL.md).
          '@
          $header = $header.Replace("X.Y.Z", "${{ steps.v.outputs.version }}").Replace("{REPO}", "${{ github.repository }}")
          Set-Content -Path notes.md -Value ($header + "`n`n" + (($generated | Out-String).Trim())) -Encoding utf8
          gh release edit $tag --draft=false --notes-file notes.md
          if ($LASTEXITCODE -ne 0) { exit 1 }
